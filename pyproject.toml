[project]
name = "py-kiwi-mobile-calculator"
version = "0.1.0"
description = "Mobile calculator with python + kiwi"
authors = [
    {name = "Serhii Kroshka",email = "pm012@ukr.net"}
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "certifi (==2025.1.31)",
    "charset-normalizer (==3.4.1)",
    "docutils (==0.21.2)",
    "filetype (==1.2.0)",
    "idna (==3.10)",
    "kivy (==2.3.1)",
    "kivy-garden (==0.1.5)",
    "pygments (==2.19.1)",
    "requests (==2.32.3)",
    "urllib3 (==2.3.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
